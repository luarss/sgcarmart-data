name: Download COE Bidding Results

on:
  schedule:
    - cron: '17 20 * * 0'  # Sunday 2017 UTC / Monday 0417 SGT (weekly)
  workflow_dispatch:

jobs:
  download:
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Download COE results
        run: uv run python scripts/download_coe.py
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        uses: ./.github/actions/commit-push
        with:
          message: "chore: update COE bidding results ${{ steps.date.outputs.date }}"
          paths: 'data/coe/*.json'

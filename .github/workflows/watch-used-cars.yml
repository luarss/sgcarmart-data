name: Watch Used Car Listings

on:
  schedule:
    - cron: '13 22 * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Free proxies are mostly dead; keep only ones that can actually reach the site.
      # A paid/residential proxy in the PROXY_URL secret (if set) is tried first.
      - name: Get SG proxies
        id: proxies
        env:
          PAID_PROXY: ${{ secrets.PROXY_URL }}
        run: |
          curl -sS --retry 3 \
            "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&country=SG&proxy_format=protocolipport&format=text&timeout=5000" \
            > all_proxies.txt || true
          check() {
            curl -s -o /dev/null -m 10 -x "$1" -w '%{http_code}' https://www.sgcarmart.com/ 2>/dev/null | grep -q '^200$' && echo "$1"
          }
          export -f check
          HEALTHY=$(grep . all_proxies.txt | xargs -P 20 -I{} bash -c 'check {}' | paste -sd, - || true)
          PROXIES="${PAID_PROXY:+$PAID_PROXY,}$HEALTHY"
          echo "paid=$([ -n "$PAID_PROXY" ] && echo yes || echo no) free_total=$(grep -c . all_proxies.txt) healthy=$(echo "$HEALTHY" | tr ',' '\n' | grep -c .)"
          echo "proxies=${PROXIES%,}" >> $GITHUB_OUTPUT

      # Retry on a fresh attempt a few times; a blocked run writes nothing, so retries are safe.
      # continue-on-error: one blocked day is not a red pipeline (see staleness check below).
      - name: Track used car listings
        id: track
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if uv run python scripts/watch_used.py; then exit 0; fi
            [ "$attempt" -lt 3 ] && echo "Attempt $attempt failed, waiting 15m..." && sleep 900
          done
          exit 1
        env:
          PROXY_FALLBACKS: ${{ steps.proxies.outputs.proxies }}

      - name: Generate value watchlist
        if: steps.track.outcome == 'success'
        run: uv run python scripts/watchlist.py --name sgd-passenger

      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: update used car watch and value watchlist ${{ steps.date.outputs.date }}"
          file_pattern: 'data/used_cars/**/*'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: GitHub Actions <github-actions[bot]@users.noreply.github.com>

      # Fail loudly only when data is actually stale, not on a single blocked day.
      - name: Check snapshot freshness
        if: always()
        run: |
          newest=$(ls data/used_cars/sgd-passenger/20??-??-??.json | sort | tail -1 | xargs basename | cut -d. -f1)
          age=$(( ( $(date +%s) - $(date -d "$newest" +%s) ) / 86400 ))
          echo "newest snapshot: $newest (${age}d old)"
          if [ "$age" -gt 2 ]; then
            echo "::error::Used-car snapshot is ${age} days old"
            exit 1
          fi
          [ "${{ steps.track.outcome }}" = "failure" ] && echo "::warning::Today's fetch was blocked after retries; snapshot is ${age}d old"
          exit 0

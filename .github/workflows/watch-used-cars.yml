name: Watch Used Car Listings

on:
  schedule:
    - cron: '0 3 * * *'  # 0300 UTC / 1100 SGT
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Get SG proxies
        id: proxies
        run: |
          PROXIES=$(curl -sS --retry 3 \
            "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&country=SG&proxy_format=protocolipport&format=text&protocol=socks4&timeout=5000" \
            | paste -sd, -)
          echo "count=$(echo "$PROXIES" | tr ',' '\n' | grep -c .)" >> $GITHUB_OUTPUT
          echo "proxies=$PROXIES" >> $GITHUB_OUTPUT

      - name: Track used car listings
        run: uv run python watch_used.py
        env:
          PROXY_FALLBACKS: ${{ steps.proxies.outputs.proxies }}

      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update used car watch ${{ steps.date.outputs.date }}"
          file_pattern: 'data/used_cars/**/*'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: GitHub Actions <github-actions[bot]@users.noreply.github.com>

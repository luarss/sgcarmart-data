name: Watch Used Car Listings

on:
  schedule:
    - cron: '0 3 * * *'  # 0300 UTC / 1100 SGT
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Get SG proxies
        id: proxies
        run: |
          PROXIES=$(curl -sS --retry 3 \
            "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&country=SG&proxy_format=protocolipport&format=text&timeout=5000" \
            | paste -sd, -)
          echo "count=$(echo "$PROXIES" | tr ',' '\n' | grep -c .)" >> $GITHUB_OUTPUT
          echo "proxies=$PROXIES" >> $GITHUB_OUTPUT

      - name: Track used car listings
        run: uv run python scripts/watch_used.py
        env:
          PROXY_FALLBACKS: ${{ steps.proxies.outputs.proxies }}

      - name: Generate value watchlist
        run: uv run python scripts/watchlist.py --name sgd-passenger

      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: update used car watch and value watchlist ${{ steps.date.outputs.date }}"
          file_pattern: 'data/used_cars/**/*'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: GitHub Actions <github-actions[bot]@users.noreply.github.com>

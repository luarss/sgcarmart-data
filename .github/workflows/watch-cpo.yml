name: Watch CPO Listings

on:
  schedule:
    - cron: '13 21 * * *'
  workflow_dispatch:

concurrency:
  group: data-commit  # serialise every workflow that pushes data to main
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04  # Playwright does not support ubuntu-latest (26.04)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Scrape CPO listings
        run: uv run cpo_main.py

      - name: Commit and push if changes
        uses: ./.github/actions/commit-data
        with:
          message: "chore: update CPO watch ${{ steps.date.outputs.date }}"
          paths: 'data/cpo/*.json'

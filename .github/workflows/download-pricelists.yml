name: Download SGCarMart Pricelists

on:
  schedule:
    - cron: '13 20 * * *'  # 2013 UTC / 0413 SGT
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies with dev extras
        run: uv sync --extra dev

      - name: Run tests with coverage
        # The suite is hermetic: tests/conftest.py blocks real sockets, so a
        # broken mock fails loudly instead of calling sgcarmart.com or an LLM
        # provider. Live drift checks are marked `network` and need --run-network.
        #
        # Coverage settings (including the fail-under ratchet) live in
        # pyproject.toml so local runs and CI agree. Don't override them here.
        run: uv run pytest --cov-report=term-missing
        env:
          # Belt and braces: no real credentials available to the test job.
          GEMINI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          XIAOMI_API_KEY: ""

  download:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            /*
            !/data/pricelists/**/*.pdf
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Download pricelists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XIAOMI_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
        run: uv run python main.py

      - name: Rebase onto latest main before committing
        run: git pull --rebase --autostash origin main

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: update new car pricelists ${{ steps.date.outputs.date }}"
          file_pattern: 'data/pricelists/**/*.pdf data/pricelists/**/*.json data/pricelists/manifest.json'
          add_options: '--sparse'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: GitHub Actions <github-actions[bot]@users.noreply.github.com>
